<div class="inlineCTA">
<h3>Want to Learn more?</h3>
    <form [formGroup]="ctaForm" (ngSubmit)="setCTAData()" novalidate>
    <input placeHolder="Name" type="text" formControlName="ctaName" class="inputInline" />
    <input placeHolder="jhon.smit@test.com" type="email" class="inputInline"
        formControlName="ctaEmail" />
    <bp-button title="Connect with Us" uiType="standardYellow" [disabled]="ctaForm.invalid" />
</form>
    
</div>

<div class="errorBlock" [ngClass]="{ 'active': ctaName?.invalid && (ctaName?.dirty || ctaName?.touched) || ctaEmail?.invalid && (ctaEmail?.dirty || ctaEmail?.touched) }">
    <ul>
        <li *ngIf="ctaName?.invalid && (ctaName?.dirty || ctaName?.touched)">
            <div *ngIf="ctaName?.errors.required">Name is required.</div>
            <div *ngIf="ctaName?.errors.minlength">
                Name must be atleast 3 letters.
            </div>
        </li>
        <li *ngIf="ctaEmail?.invalid && (ctaEmail?.dirty || ctaEmail?.touched)">
            <div *ngIf="ctaEmail?.errors.required">Email is required.</div>
            <div *ngIf="ctaEmail?.errors.minlength">
                A minimum of 2 letters are required.
            </div>
            <div *ngIf="ctaEmail?.errors.email">Email is not valid.</div>
    </ul>

</div>
