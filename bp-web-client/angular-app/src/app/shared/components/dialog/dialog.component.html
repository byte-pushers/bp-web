<div class="bpPopup" *ngIf="isDialog">
    <div class="popupHeader">
        <div class="title">Want to Learn More?</div>
        <div class="close" (click)="closeDialog()"><fa-icon [icon]="faClose"></fa-icon></div>
    </div>
    <div class="popupBody">
        <app-call-to-action></app-call-to-action>
    </div>
    <div class="popupFooter"></div>
</div>
<div class="grayOverlay" *ngIf="isDialog"></div>
