<!-- newly refactored code -->
<section class="headerTheme" [ngStyle]="setThemeBGImg()" [ngClass]="showBorders() ? 'bordersTrue' : ''">
  <section class="header"></section>
  <section class="bodyContent">
    <div class="customContainer">
      <div class="twoCol d-flex j-c-s-b a-bottom">
        <div class="contentArea d-flex flexWrap a-bottom flexEnd">
          <div class="empty"></div>
          <div class="content bottomLayout">
            <h2 [ngStyle]="setTitleColor()" [innerHTML]="contentTitle"></h2>
            <p class="MADslogan" [innerHTML]="slogan" [ngStyle]="setThemeSecondaryColor()"></p>

            <div class="knowMore">
              <img class="arrow" src="../../../../assets/images/Arrow-Vector.png" alt="" srcset="" />
              <bp-button title="Want to Learn More?" uiType="standardYellow" (onClick)="getCTA()" />
            </div>
          </div>
        </div>
        <div class="socialMediaIcons d-flex a-center">
          <social-media></social-media>
        </div>
      </div>
    </div>
  </section>
  <!-- <app-hero-logos [colorofLogos]="setThemeSecondaryColor()"></app-hero-logos> -->
  <app-companies-we-keep [ngClass]="showBorders()" class="bdr-gray-500"
    [logosColor]="'var(--companies-logo-color)'"></app-companies-we-keep>
</section>
